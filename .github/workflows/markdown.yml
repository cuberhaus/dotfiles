name: Markdown

on:
  push:
    branches: [master]
    paths: ['*.md', '.local/README.md']
  pull_request:
    branches: [master]
    paths: ['*.md', '.local/README.md']

jobs:
  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Lint own Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          globs: |
            README.md
            .local/README.md
            .local/xdg/wallpapers/README.md
