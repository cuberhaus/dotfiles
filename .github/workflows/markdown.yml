name: Markdown

on:
  push:
    branches: [main]
    paths: ['**.md', '.markdownlint.json', '.local/scripts/lint_helpers.sh']
  pull_request:
    branches: [main]
    paths: ['**.md', '.markdownlint.json', '.local/scripts/lint_helpers.sh']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: false

      - name: List Markdown files to lint
        id: files
        # Same list as `make check`: every tracked file except vendored text.
        run: |
          source .local/scripts/lint_helpers.sh
          {
            echo 'globs<<EOF'
            lint_get_markdown
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Lint own Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: ${{ steps.files.outputs.globs }}
