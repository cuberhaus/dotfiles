name: Lint

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - .local/README.md
      - .local/xdg/wallpapers/README.md
  pull_request:
    branches: [main]
    paths-ignore:
      - README.md
      - .local/README.md
      - .local/xdg/wallpapers/README.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  shell-tests:
    name: Shell unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false

      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends stow zsh

      - name: Run shell unit tests
        run: |
          for test_file in tests/test_*.sh; do
            [ "$test_file" = "tests/test_platforms_in_containers.sh" ] && continue
            bash "$test_file"
          done

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: false  # vendored submodules aren't needed for linting

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run lint
        run: bash .local/scripts/lint.sh

  hardcoded-paths:
    name: Hardcoded user paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false

      - name: Scan for /home/<user>/ and /Users/<user>/ in tracked files
        shell: bash
        run: |
          source .local/scripts/lint_helpers.sh
          matches=$(git grep -InE "$HARDCODED_PATHS_REGEX" \
              -- "${HARDCODED_PATHS_EXCLUDES[@]}" | grep -v '/home/linuxbrew/' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo ""
            echo "ERROR: hardcoded user paths found in tracked files (see above)."
            echo "Use \$HOME, ~/, or XDG variables instead."
            exit 1
          fi

  stow-dryrun:
    name: Stow dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false

      - name: Install stow
        run: sudo apt-get update && sudo apt-get install -y stow

      - name: Dry-run stow into a scratch HOME
        run: |
          scratch="$(mktemp -d)"
          make dry-run TARGET="$scratch"
