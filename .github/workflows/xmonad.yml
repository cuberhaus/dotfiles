name: XMonad

on:
  push:
    branches: [master]
    paths: ['.xmonad/xmonad.hs']
  pull_request:
    branches: [master]
    paths: ['.xmonad/xmonad.hs']

jobs:
  compile-check:
    name: Compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install GHC and XMonad libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ghc libghc-xmonad-dev libghc-xmonad-contrib-dev

      - name: Verify xmonad.hs compiles
        run: ghc -fno-code -Wall .xmonad/xmonad.hs
