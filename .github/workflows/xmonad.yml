name: XMonad

on:
  push:
    branches: [master]
    paths: ['.xmonad/xmonad.hs']
  pull_request:
    branches: [master]
    paths: ['.xmonad/xmonad.hs']

jobs:
  compile-check:
    name: Compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
          cabal-version: 'latest'

      - name: Install X11 development libraries
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxft-dev libxinerama-dev libxrandr-dev libxss-dev

      - name: Install XMonad libraries
        run: cabal install --lib xmonad xmonad-contrib containers

      - name: Verify xmonad.hs compiles
        run: ghc -fno-code .xmonad/xmonad.hs
