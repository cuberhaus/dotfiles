# Weekly dependency-bump PRs against main. One multi-ecosystem group so
# git submodule (i3blocks-contrib, tpm, base16-shell, etc.) and
# github-actions bumps land in a single PR per week instead of one PR
# per ecosystem.
#
# Submodules are upstream code sourced into the shell; do NOT auto-merge —
# review the diff.

version: 2

multi-ecosystem-groups:
  weekly-dependency-refresh:
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      include: scope

updates:
  - package-ecosystem: gitsubmodule
    directory: /
    multi-ecosystem-group: weekly-dependency-refresh
    patterns:
      - '*'

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: weekly-dependency-refresh
    patterns:
      - '*'
