[global]
   server role = standalone server
   workgroup = WORKGROUP
   server string = pol-server
   interfaces = lo wlp2s0
   bind interfaces only = yes
   smb ports = 445
   disable netbios = yes
   hosts allow = 127.0.0.1 192.168.1.0/24
   hosts deny = ALL
   map to guest = Never
   restrict anonymous = 2
   usershare allow guests = no
   server min protocol = SMB2_10
   server max protocol = SMB3
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log file = /var/log/samba/log.%m
   logging = file
   max log size = 1000

[shared]
   path = /srv/storage/shared
   browseable = yes
   read only = no
   guest ok = no
   valid users = @nasusers
   force group = nasusers
   create mask = 0660
   force create mode = 0660
   directory mask = 2770
   force directory mode = 2770
   follow symlinks = no
   wide links = no

[incoming]
   path = /srv/storage/incoming
   browseable = yes
   read only = no
   guest ok = no
   valid users = @nasusers
   force group = nasusers
   create mask = 0660
   force create mode = 0660
   directory mask = 2770
   force directory mode = 2770
   follow symlinks = no
   wide links = no

[private]
   path = /srv/storage/private
   browseable = yes
   access based share enum = yes
   read only = no
   guest ok = no
   valid users = pol-files
   create mask = 0600
   force create mode = 0600
   directory mask = 0700
   force directory mode = 0700
   follow symlinks = no
   wide links = no